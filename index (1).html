<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a0c23">
<title>Origin</title>
<style>
:root{--burg:#801333;--burg-d:#5a0c23;--burg-dd:#33061a;--orange:#f16822;--green:#36c972}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--burg-dd)}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.screen{position:relative;height:100vh;height:100dvh;width:100%;max-width:520px;margin:0 auto;overflow:hidden;
display:flex;flex-direction:column;align-items:center;text-align:center;
padding:calc(env(safe-area-inset-top) + 3.2vh) 24px calc(env(safe-area-inset-bottom) + 3.2vh)}
.screen.auth{background:radial-gradient(130% 80% at 50% 0%,#a01c44 0%,var(--burg) 38%,var(--burg-d) 70%,var(--burg-dd) 100%)}
.screen.pts{background:radial-gradient(130% 75% at 50% 0%,#f37a3a 0%,#d4472c 28%,var(--burg) 62%,var(--burg-dd) 100%)}
.screen.bad{background:radial-gradient(130% 80% at 50% 0%,#4b4246 0%,#2a2326 60%,#141012 100%)}
/* brand motif: light beams + floating dots */
.beam{position:absolute;pointer-events:none;opacity:.5}
.beam.h{left:-20%;right:-20%;height:18vh;top:38%;transform:rotate(-12deg);
background:linear-gradient(90deg,transparent,rgba(241,104,34,.35) 40%,rgba(241,104,34,.7) 70%,transparent);filter:blur(14px);animation:sweep 7s ease-in-out infinite}
.beam.v{top:-10%;bottom:-10%;width:12vw;left:72%;
background:linear-gradient(180deg,transparent,rgba(241,104,34,.45) 45%,transparent);filter:blur(10px)}
.screen.bad .beam{filter:grayscale(1) blur(14px);opacity:.25}
@keyframes sweep{50%{transform:rotate(-12deg) translateX(6%)}}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb.g{width:16px;height:16px;background:var(--green);left:calc(72% + 6vw - 8px);top:22%;box-shadow:0 0 18px var(--green);animation:bob 4s ease-in-out infinite}
.orb.o{width:10px;height:10px;background:var(--orange);left:7%;top:80%;box-shadow:0 0 14px var(--orange);animation:bob 5s ease-in-out infinite reverse}
.screen.bad .orb{display:none}
@keyframes bob{50%{transform:translateY(-12px)}}
.logo{height:clamp(26px,4.2vh,36px);position:relative;z-index:2;opacity:0;animation:fadeD .6s .05s ease forwards}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;width:100%;min-height:0}
/* seal */
.seal{position:relative;width:clamp(130px,26vh,200px);height:clamp(130px,26vh,200px);opacity:0;animation:pop .7s .2s cubic-bezier(.2,1.4,.4,1) forwards}
.seal .disc{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px)}
.seal .core{position:absolute;inset:12%;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.seal svg{width:70%;height:70%;overflow:visible}
.ring{stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1s .55s cubic-bezier(.65,0,.35,1) forwards}
.tick{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .45s 1.4s ease-out forwards}
.wave{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.6);opacity:0;animation:wave 2.6s 1.6s ease-out infinite}
.wave.w2{animation-delay:2.9s}
.screen.pts .wave{border-color:rgba(255,210,180,.8)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wave{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fadeU{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeD{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.pnum{font-size:clamp(32px,6.6vh,54px);font-weight:700;color:var(--burg);line-height:.95;letter-spacing:-.03em}
.plbl{font-size:clamp(10px,1.5vh,12px);font-weight:700;letter-spacing:.2em;color:var(--orange);margin-top:4px}
.badge{margin-top:clamp(16px,3.4vh,30px);display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
opacity:0;animation:fadeU .6s 1.5s ease forwards}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.badge.warn i{background:#ffc04d;box-shadow:0 0 10px #ffc04d}
.badge.bad i{background:#ff5a5a;box-shadow:0 0 10px #ff5a5a}
h1{font-size:clamp(26px,4.6vh,38px);font-weight:700;line-height:1.1;letter-spacing:-.015em;margin-top:clamp(10px,1.8vh,16px);
opacity:0;animation:fadeU .6s 1.65s ease forwards}
.sub{font-size:clamp(14px,2.1vh,16px);line-height:1.45;opacity:0;margin-top:8px;max-width:320px;color:rgba(255,255,255,.82);animation:fadeU .6s 1.8s ease forwards}
.serial{margin-top:clamp(12px,2.4vh,20px);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.12em;
padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.14);opacity:0;animation:fadeU .6s 1.95s ease forwards}
.serial span{opacity:.6;letter-spacing:.06em;margin-right:6px;font-family:inherit}
.actions{width:100%;max-width:400px;position:relative;z-index:2;opacity:0;animation:fadeU .6s 2.1s ease forwards}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:clamp(13px,2.1vh,17px);border-radius:16px;
font-size:16px;font-weight:700;text-decoration:none;background:#fff;color:var(--burg);box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.store{display:flex;align-items:center;justify-content:center;gap:9px;background:#0b0b0b;color:#fff;text-decoration:none;border-radius:14px;
padding:clamp(9px,1.5vh,12px) 10px;border:1px solid rgba(255,255,255,.22);text-align:left;transition:transform .15s}
.store:active{transform:scale(.97)}
.store svg{width:22px;height:22px;flex:none}
.store small{display:block;font-size:9.5px;opacity:.75}
.store b{display:block;font-size:15px;font-weight:600;line-height:1.1}
.store.hl{border-color:var(--orange);box-shadow:0 0 0 2px rgba(241,104,34,.5)}
.foot{margin-top:clamp(10px,1.8vh,14px);font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.55)}
.foot a{color:rgba(255,255,255,.75);text-decoration:none}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(241,104,34,.25),transparent);animation:shine 3.2s 2.8s ease-in-out infinite}
@keyframes shine{to{left:130%}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (max-height:600px){.auth .sub,.bad .sub,.pts .serial{display:none}}
.store b{white-space:nowrap}
@media (max-width:350px){.store{gap:7px;padding-left:6px;padding-right:6px}.store b{font-size:13px}.store small{font-size:8.5px}.store svg{width:19px;height:19px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
